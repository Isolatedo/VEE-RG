[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "veerg-architecture"
version = "0.1.0"
description = "Architecture source for VEE-RG regional longitudinal report generation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "PyYAML>=6.0",
  "torch>=2.0",
  "torchvision>=0.15",
  "transformers>=4.40",
]

[tool.setuptools.packages.find]
where = ["src"]
